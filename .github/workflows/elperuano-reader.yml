name: elperuano-reader

on:
  schedule:
    - cron: '0 13 * * *' # daily ~08:00 Lima, after publication
  workflow_dispatch:

permissions:
  issues: write
  contents: write # push the normas archive branch

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf anthropic
      - name: Read El Peruano and file candidate issues
        run: python3 tools/scrapers/elperuano_reader.py --archive-dir "$RUNNER_TEMP/normas"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # judge activates only if this secret exists
      - name: Push the day's records to the normas-archive branch
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/normas/*.jsonl)
          [ ${#files[@]} -gt 0 ] || { echo "no archive files; skipping"; exit 0; }
          tools/ci/publish_data_branch.sh normas-archive "chore: archive normas $(date -u +%F)" \
            bash -c 'mkdir -p "$DATA_DIR/normas" && cp "$RUNNER_TEMP"/normas/*.jsonl "$DATA_DIR/normas/"'
