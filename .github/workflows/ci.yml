name: ci

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: python3 tools/scrapers/build_commitment_index.py --check
      - run: python3 -m unittest discover -s tools/tests -p "test_*.py"
      - run: npm run build
